name: Codex Auto-Fix (on CI failure)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run Codex auto-fix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          codex exec \
            "Fix the failing GitHub Actions CI for this repo. Run the same commands as CI. Make the smallest change that makes CI pass. Do not remove tests. Commit the fix."

      - name: Create PR with fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a branch, commit if codex didn't, and open a PR
          git checkout -b codex/autofix-${{ github.run_id }}
          git add -A
          git commit -m "Auto-fix CI failure" || echo "No changes to commit"
          git push -u origin HEAD
          gh pr create --title "Auto-fix CI failure" --body "Generated by Codex based on failed CI run: ${{ github.event.workflow_run.html_url }}" --base main
